<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hvilket norsk villdyr er du?</title>
<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#1d2a24;--mute:#5d6b63;--line:#d3dad0;--accent:#1f5c46;--accent-ink:#fff;--berry:#a3283a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--ink:#e8eee9;--mute:#98a89e;--line:#31413a;--accent:#7fc4a3;--accent-ink:#0f1b15;--berry:#e0788a}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--ink:#e8eee9;--mute:#98a89e;--line:#31413a;--accent:#7fc4a3;--accent-ink:#0f1b15;--berry:#e0788a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 18px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:2.3rem}
.lead{color:var(--mute);margin:12px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.ghost{background:none;color:var(--mute);padding:8px 4px;font-weight:500}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.count{color:var(--mute);font-size:.9rem}
h2{font-size:1.5rem;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.emoji{font-size:4.5rem;line-height:1}
.res h2{font-size:2.2rem;margin:8px 0}
.res p{margin:0 0 14px}
.row{display:grid;grid-template-columns:5.5rem 1fr 1.6rem;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.row .bar{margin:0}
.row.top .bar i{background:var(--berry)}
.row span:last-child{text-align:right;color:var(--mute)}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="start">
<h1>Hvilket norsk villdyr er du?</h1>
<p class="lead">Ti spørsmål om personlighet og kropp. Svar ærlig, så finner vi ut om du er bjørn, hare eller noe midt imellom.</p>
<button class="btn" id="go">Start quizen</button>
</section>

<section id="quiz" class="hide">
<div class="count" id="count"></div>
<div class="bar"><i id="fill"></i></div>
<div class="card">
<h2 id="q"></h2>
<div class="opts" id="opts"></div>
</div>
<div class="nav"><button class="btn ghost" id="back">Tilbake</button><button class="btn" id="next" disabled>Neste</button></div>
</section>

<section id="result" class="hide res">
<div class="card">
<div class="emoji" id="rEmoji"></div>
<h2 id="rName"></h2>
<p id="rText"></p>
<div id="rBars"></div>
</div>
<div class="nav"><button class="btn" id="again">Ta quizen på nytt</button></div>
</section>
</main>

<script>
const A=[
["Brunbjørn","🐻","Sterk, trygg og litt sløv til du blir presset. Du elsker mat, hvile og dine nærmeste."],
["Gaupe","🐈","Smidig, selvstendig og observant. Du jobber best alene og treffer når det gjelder."],
["Rødrev","🦊","Kvikk, tilpasningsdyktig og sjarmerende. Du finner alltid en løsning."],
["Elg","🫎","Høy, rolig og tålmodig. Du går ditt eget tempo og er tryggere enn du ser ut til."],
["Ulv","🐺","Lojal, strategisk og utholdende. Du trives best i flokk og tar ansvar når det trengs."],
["Oter","🦦","Lekende, nysgjerrig og smidig. Du tar livet med humor og er i ditt ess ved vannet."],
["Snøugle","🦉","Stille, mystisk og skarp. Du ser alt, sier lite og slår til på riktig tidspunkt."],
["Hare","🐇","Rask, var og sensitiv. Du trives i trygge omgivelser og er lynraskt ute når det trengs."]];
const Q=[
["Fredagskveld, hva er ideelt?",["Sofa, teppe og masse mat","Alene og i fred, gjerne med god utsikt","Spontant, hva som helst med folk","Rolig skogstur i eget tempo","Hele gjengen samlet","Noe lekent ved vannet","Stille kveld der jeg observerer i mørket","Trygt og hyggelig hjemme"]],
["Hvordan er kroppsbygningen din?",["Bred, sterk og solid","Slank, smidig og lett på foten","Middels og kvikk","Høy og langbeint","Atletisk og utholdende","Lang, smidig og glatt","Lys og lydløs med skarpt blikk","Liten med lange, raske bein"]],
["Når noen provoserer deg, gjør du…",["Holder ut lenge, men når det brister, brister det","Trekker deg stille unna","Finner en lur omvei","Ignorerer det","Setter tydelige grenser sammen med dine","Gjør det om til en lek","Iakttar i stillhet og slår til når tiden er inne","Er raskt ute av situasjonen"]],
["Døgnrytmen din?",["Elsker å sove, helst hele vinteren","Nattugle, mest våken i skumringen","Oppe tidlig og alltid i gang","Rolig morgen og kveld, hvile midt på dagen","Alltid på farten, dag som natt","Leken hele dagen, mest i skumringen","Våken hele natten, også når sommeren er lys","Skumring og natt, alltid på vakt"]],
["Hva spiser du helst?",["Alt, særlig bær og noe søtt","Kjøtt, gjerne noe litt eksklusivt","Litt av hvert, og rester er greit","Grønt og lette ting","Kjøtt, helst delt med flokken","Fisk og sjømat","Små, raske godbiter","Urter, gress og salat"]],
["I sosiale settinger er du…",["Familiemennesket som passer på sine","Enstøingen som trives best alene","Sjarmøren som får alle med seg","Den rolige i en liten, trygg gruppe","Den lojale lederen","Den nysgjerrige og morsomme","Den mystiske som få kjenner godt","Den følsomme som trenger rolige omgivelser"]],
["Hvordan takler du stress?",["Sover på det","Trekker meg tilbake","Improviserer","Puster dypt og går videre","Samler gruppa og legger en plan","Ler det bort","Blir helt stille og observerer","Løper ut og lufter hodet"]],
["Drømmeferie?",["Hytte med bålkos og god mat","Fjelltopp helt alene","Storby med nye folk","Åpen vidde eller myr","Villmarkstur med gjengen","Kajakk og bading","Snødekt fjellvidde","Kjente stier nær hjemmet"]],
["Hvilken stil har du?",["Stor, varm ullgenser","Svart og minimalistisk","Rødbrunt med en liten kul detalj","Naturfarger og lange bukser","Grått og praktisk","Vanntett jakke og fleecetrøye","Hvitt og lyst","Beige, myke lag"]],
["Hva er din største styrke?",["Kraft","Tålmodighet og skarpt blikk","Lure løsninger","Ro","Lederskap","Godt humør","Skarp hørsel og oppmerksomhet","Fart"]]];
const $=id=>document.getElementById(id);
let i=0,ans=[];
const show=id=>["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));
function render(){
  $("count").textContent="Spørsmål "+(i+1)+" av "+Q.length;
  $("fill").style.width=(i/Q.length*100)+"%";
  $("q").textContent=Q[i][0];
  $("opts").innerHTML="";
  Q[i][1].forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt"+(ans[i]===k?" sel":"");
    b.textContent=t;
    b.onclick=()=>{ans[i]=k;render();};
    $("opts").appendChild(b);
  });
  $("next").disabled=ans[i]===undefined;
  $("next").textContent=i===Q.length-1?"Se resultat":"Neste";
  $("back").style.visibility=i===0?"hidden":"visible";
}
function finish(){
  const s=A.map(()=>0);
  ans.forEach(k=>s[k]++);
  const max=Math.max(...s);
  const tops=s.map((v,k)=>v===max?k:-1).filter(k=>k>=0);
  if(tops.length===1){
    const a=A[tops[0]];
    $("rEmoji").textContent=a[1];$("rName").textContent=a[0];$("rText").textContent=a[2];
  }else{
    $("rEmoji").textContent=tops.map(k=>A[k][1]).join(" ");
    $("rName").textContent=tops.map(k=>A[k][0]).join(" + ");
    $("rText").textContent="Uavgjort! Du er en blanding: "+tops.map(k=>A[k][2]).join(" Samtidig: ");
  }
  $("rBars").innerHTML=A.map((a,k)=>'<div class="row'+(s[k]===max?' top':'')+'"><span>'+a[1]+' '+a[0]+'</span><div class="bar"><i style="width:'+(s[k]/Q.length*100)+'%"></i></div><span>'+s[k]+'</span></div>').join("");
  show("result");window.scrollTo(0,0);
}
$("go").onclick=()=>{i=0;ans=[];show("quiz");render();};
$("next").onclick=()=>{if(i<Q.length-1){i++;render();}else finish();};
$("back").onclick=()=>{if(i>0){i--;render();}};
$("again").onclick=()=>{i=0;ans=[];show("start");window.scrollTo(0,0);};
</script>
</body>
</html>
